<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" rel="stylesheet">
<title></title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%}
#last{position:fixed;top:40%;width:100%;text-align:center;font:bold 20px 'Google Sans',system-ui,sans-serif;color:#222}
.skins{position:relative;isolation:isolate;box-sizing:border-box;width:min(116px,calc((100vw - 52px)/3));height:92px;padding:0 4px 8px;display:flex;align-items:flex-end;justify-content:center;background:#1e6fe8;color:#fff;font:bold 16px 'Google Sans',system-ui,sans-serif;border:3px solid #000;border-radius:16px;cursor:pointer;-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.skins{line-height:1.05;text-align:center}
.xtr{background:#ffd23f}
.skins:active{transform:scale(.96)}
#stats{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;display:flex;gap:8px}
.stat{box-sizing:border-box;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;background:#1e6fe8;border:3px solid #000;border-radius:14px;color:#fff;font:bold 16px 'Google Sans',system-ui,sans-serif;-webkit-text-stroke:.7px #000;paint-order:stroke fill;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;line-height:1.1}
.stat small{font-size:11px;-webkit-text-stroke:.4px #000}
#menuBtns{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px}
.upg{background:#e63946}
#upPanel{position:fixed;inset:0;z-index:5;background:#fff;display:none;flex-direction:column;font-family:'Google Sans',system-ui,sans-serif;color:#222;overflow-y:auto;touch-action:pan-y;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
#upMsg{min-height:22px;margin:8px 0;text-align:center;color:#e63946;font-weight:bold}
.upc{border:3px solid #000;border-radius:14px;background:#fff1f1;padding:12px;margin-bottom:12px}
.upc h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:20px}
.upc h3 img{height:34px;width:auto}
.upr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:2px solid #0002}
.upr b{display:block;font-size:16px}
.upr span{font-size:14px;color:#555}
.upr button{white-space:nowrap}
/* couches : fond bleu < ballon < texte */
.skins::before{content:'';position:absolute;left:0;right:0;top:5px;height:68px;background:var(--ball) center/contain no-repeat;z-index:-1;pointer-events:none}

.ui{padding:12px 32px;background:#1e6fe8;color:#fff;font:bold 20px 'Google Sans',system-ui,sans-serif;border:3px solid #000;border-radius:16px;cursor:pointer;-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.ui:active{transform:scale(.96)}
.ui.red{background:#e63946}
.ui.sm{padding:8px 12px;font-size:15px;border-width:2px;border-radius:12px;-webkit-text-stroke:.5px #000}
#openSet{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:48px;height:48px;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
#openSet svg{width:30px;height:30px}
#settings{position:fixed;inset:0;z-index:5;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:18px;overflow-y:auto;touch-action:pan-y;padding:16px 12px;box-sizing:border-box;font-family:'Google Sans',system-ui,sans-serif;color:#222}
#settings h2{margin:0;font-size:28px}
.row{display:flex;align-items:center;gap:20px;font-weight:bold;font-size:22px}
.sw{box-sizing:border-box;width:64px;height:34px;border-radius:17px;border:3px solid #000;background:#bbb;position:relative;padding:0;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #000;box-sizing:border-box}
.sw.on{background:#2ecc40}
.sw.on::after{left:32px}
#skinsPanel{position:fixed;inset:0;z-index:5;background:#fff;display:none;flex-direction:column;font-family:'Google Sans',system-ui,sans-serif;color:#222;overflow-y:auto;touch-action:pan-y;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
.skHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.skHead h2{margin:0;font-size:26px}
#skWallet{min-width:74px;text-align:right;font-weight:bold;font-size:20px}
#skMsg{min-height:22px;margin:8px 0;text-align:center;color:#e63946;font-weight:bold}
#skGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:#eef4ff;border:3px solid #000;border-radius:14px;font:bold 14px 'Google Sans',system-ui,sans-serif;color:#222;cursor:pointer}
.sk img{height:84px;width:auto;object-fit:contain}
.sk small{font-size:13px}
.sk.eq{background:#c9f7c9}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ffd23f;border:2px solid #b8860b;box-sizing:border-box;vertical-align:-2px}
.ui.green{background:#2ecc40}
.ui:disabled{opacity:.45;cursor:default}
.saveRow{display:flex;gap:10px;width:min(100%,340px)}
.saveRow .ui{flex:1;padding:12px 10px;font-size:17px}
.infoz{box-sizing:border-box;width:min(100%,300px);padding:10px 16px;background:#fff;color:#222;border:3px solid #000;border-radius:16px;font-weight:bold;text-align:center}
.irow{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
#saveMsg{min-height:20px;font-weight:bold;text-align:center}
#langSel{font:bold 18px 'Google Sans',system-ui,sans-serif;padding:8px 10px;border:3px solid #000;border-radius:12px;background:#fff;color:#222}
#rstBox{display:none;flex-direction:column;align-items:center;gap:10px;max-width:290px;font-weight:bold;text-align:center}
.rstRow{display:flex;gap:10px}
#rstMsg{min-height:20px;color:#2a9d2a;font-weight:bold;text-align:center}
#codeBox{display:none;flex-direction:column;align-items:center;gap:10px}
#codeIn{box-sizing:border-box;width:210px;padding:8px 12px;border:3px solid #000;border-radius:12px;font:bold 20px 'Google Sans',system-ui,sans-serif;text-align:center;-webkit-user-select:text;user-select:text}
#codeErr{min-height:20px;color:#e63946;font:bold 16px 'Google Sans',system-ui,sans-serif}
#dbgCoins{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));right:10px;display:none;flex-direction:column;align-items:flex-end;gap:4px}
#dbg{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 8px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="last"></div>
<div id="stats">
  <div class="stat"><small data-i18n="best">Meilleur score</small><span id="stBest">0 m</span></div>
  <div class="stat"><small data-i18n="coins">Pièces</small><span id="stCoins">0</span></div>
</div>
<div id="menuBtns">
  <button class="skins" type="button" data-i18n="skins">Skins</button>
  <button class="skins upg" id="upBtn" type="button" data-i18n="upgrade">Upgrade</button>
  <button class="skins xtr" id="xtrBtn" type="button" data-i18n="extremeMode">Extrem mode</button>
</div>

<div id="settings">
  <h2 data-i18n="settings">Paramètres</h2>
  <label class="row"><span data-i18n="language">Langue</span><select id="langSel"></select></label>
  <div class="saveRow">
    <button class="ui green" id="saveDl" type="button" data-i18n="dl">Télécharger</button>
    <button class="ui" id="saveImp" type="button" data-i18n="imp">Importer</button>
  </div>
  <input type="file" id="saveFile" style="display:none">
  <div class="infoz" id="infoSave"></div>
  <button class="ui" id="useSave" type="button" data-i18n="useSave" disabled>Utiliser cette sauvegarde</button>
  <div id="saveMsg"></div>
  <button class="ui red" id="rstBtn" type="button" data-i18n="reset">Réinitialiser la progression</button>
  <div id="rstBox">
    <span data-i18n="resetAsk">Tout effacer ?</span>
    <div class="rstRow"><button class="ui sm red" id="rstYes" type="button" data-i18n="yes">Oui</button><button class="ui sm" id="rstNo" type="button" data-i18n="no">Non</button></div>
  </div>
  <div id="rstMsg"></div>
  <label class="row"><span data-i18n="debug">Debug mode (dev only)</span><button class="sw" id="swDebug" type="button" role="switch" aria-checked="false"></button></label>
  <div id="codeBox">
    <input id="codeIn" type="password" data-i18n-ph="code" placeholder="Code" autocomplete="off" autocapitalize="off">
    <button class="ui sm" id="codeOk" type="button" data-i18n="validate">Valider</button>
    <div id="codeErr"></div>
  </div>
  <button class="ui" id="backSet" type="button" data-i18n="back">Retour</button>
</div>
<div id="skinsPanel">
  <div class="skHead"><button class="ui sm" id="skBack" type="button" data-i18n="back">Retour</button><h2 data-i18n="skins">Skins</h2><div id="skWallet"></div></div>
  <div id="skMsg"></div>
  <div id="skGrid"></div>
</div>
<div id="upPanel">
  <div class="skHead"><button class="ui sm" id="upBack" type="button" data-i18n="back">Retour</button><h2 data-i18n="upgrade">Upgrade</h2><div id="upWallet"></div></div>
  <div id="upMsg"></div>
  <div id="upList"></div>
</div>
<div id="dbgCoins">
  <button class="ui sm" type="button" data-a="3">+3</button>
  <button class="ui sm" type="button" data-a="5">+5</button>
  <button class="ui sm" type="button" data-a="10">+10</button>
  <button class="ui sm" type="button" data-a="1000">+1000</button>
  <button class="ui sm" type="button" data-a="10000">+10000</button>
</div>
<div id="dbg">
  <button class="ui sm" type="button" data-a="g">Invincible</button>
  <button class="ui sm" type="button" data-a="o">Turbo</button>
  <button class="ui sm" type="button" data-a="m">Méga turbo</button>
  <button class="ui sm" type="button" data-a="a">Aimant</button>
  <button class="ui sm" type="button" data-a="s">Éclair bleu</button>
  <button class="ui sm red" type="button" data-a="die">Instant die</button>
</div>

const TINT={};
// ballon teinté : l'intérieur blanc prend la couleur, le contour noir reste
function tint(color){
  if(color==='#ffffff'||!IMG.width)return IMG;
  if(TINT[color])return TINT[color];
  const c=document.createElement('canvas'),x=c.getContext('2d');
  c.width=IMG.width;c.height=IMG.height;x.drawImage(IMG,0,0);
  x.globalCompositeOperation='multiply';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);
  x.globalCompositeOperation='destination-in';x.drawImage(IMG,0,0);
  return TINT[color]=c;
}
function skinColor(){return(SKINS.find(k=>k.id===eq)||SKINS[0]).c}

}

  {gk:'turbo',col:'#ff9f1c',icon:ICON_BOLT,rows:[

function renderUp(){
  upWallet.innerHTML=wallet+' <span class="dot"></span>';

    const card=document.createElement('div');card.className='upc';
    card.innerHTML='<h3><img src="'+grp.icon+'" alt="">'+t(grp.gk)+'</h3>';
    for(const r of grp.rows){
      const l=up[r.k],cost=r.base*(l+1),maxed=l>=MAXLV;
      const row=document.createElement('div');row.className='upr';
      row.innerHTML='<div><b>'+t(r.nk)+'</b><span>'+r.fmt(l)+(maxed?'':' → '+r.fmt(l+1))+' · '+t('level')+' '+l+'/'+MAXLV+'</span></div>';

      b.innerHTML=maxed?'MAX':cost+' <span class="dot"></span>';

document.getElementById('saveImp').onclick=()=>{saveFile.value='';saveFile.click()};
saveFile.onchange=()=>{
  const f=saveFile.files[0];if(!f)return;
  saveMsg.textContent='';pending=null;useSave.disabled=true;
  const bad=()=>{saveMsg.style.color='#e63946';saveMsg.textContent=t('badFile');refreshInfo()};
  if(!/\.sklmtsv$/i.test(f.name))return bad();
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||o.game!=='ballon')throw 0;
      const ids=SKINS.map(k=>k.id),lv=v=>Math.max(0,Math.min(MAXLV,v|0));
      const own2=[...new Set(['blanc',...(Array.isArray(o.own)?o.own:[]).filter(i=>ids.includes(i))])],u=o.up||{};
      pending={wallet:Math.max(0,Math.floor(+o.wallet)||0),own:own2,eq:own2.includes(o.eq)?o.eq:'blanc',best:Math.max(0,Math.floor(+o.best)||0),
        up:{inv:lv(u.inv),td:lv(u.td),ts:lv(u.ts),mg:lv(u.mg)}};
      useSave.disabled=false;refreshInfo();
    }catch(e){bad()}
  };
  r.onerror=bad;r.readAsText(f);
};
useSave.onclick=()=>{
  if(!pending)return;
  wallet=pending.wallet;own=pending.own.slice();eq=pending.eq;up=Object.assign({},pending.up);best=pending.best;
  try{localStorage.setItem('ballon_best',String(best))}catch(e){}

};

// ----- Fond du menu : ciel + ballons à différentes distances -----
let menuSpace=false;try{menuSpace=localStorage.getItem('ballon_menuspace')==='1'}catch(e){}
const MB=[];
let mprev=performance.now();
function newMB(first){
  const z=Math.random(),h=30+z*70;   // z : 0 = loin (petit), 1 = proche (grand)
  return {z,h,x:Math.random()*W,y:first?Math.random()*(H+h):H+h*(1+Math.random()),ph:Math.random()*6,c:SKINS[(Math.random()*SKINS.length)|0].c};
}
for(let i=0;i<8;i++)MB.push(newMB(true));
MB.sort((a,b)=>a.z-b.z);
function menuLoop(now){
  if(state!=='menu')return;
  const dt=Math.min(.05,(now-mprev)/1000);mprev=now;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,extreme?'#1a0003':menuSpace?'#03030f':'#7cc4ff');g.addColorStop(1,extreme?'#7a0f18':menuSpace?'#1a1450':'#d6f0ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(extreme||menuSpace){
    // mode extrême (espace rouge) ou mort dans l'espace : fond d'étoiles qui défilent, sans ballon
    ctx.fillStyle='#fff';
    for(const st of STARS){st.y+=st.z*400*dt*.3/H;if(st.y>1){st.y=0;st.x=Math.random()}ctx.globalAlpha=st.z;ctx.fillRect(st.x*W,st.y*H,st.z*2.5,st.z*2.5)}
    ctx.globalAlpha=1;
  }else if(IMG.width){
    let respawn=false;
    for(let i=0;i<MB.length;i++){
      let b=MB[i];b.y-=(18+b.z*80)*dt;   // les plus proches défilent plus vite
      if(b.y+b.h<0){b=MB[i]=newMB(false);respawn=true}
      const w=b.h*IMG.width/IMG.height;
      ctx.drawImage(tint(b.c),b.x+Math.sin(now/1000*1.2+b.ph)*10*b.z-w/2,b.y,w,b.h);
    }
    if(respawn)MB.sort((a,b)=>a.z-b.z);
  }
  requestAnimationFrame(menuLoop);
}
requestAnimationFrame(menuLoop);

const CODE='12345QWERTY',codeBox=document.getElementById('codeBox'),codeIn=document.getElementById('codeIn'),codeErr=document.getElementById('codeErr');
function saveDebug(){try{localStorage.setItem('ballon_debug2',debug?'1':'0')}catch(e){}syncSw()}
// désactiver est libre ; activer demande le code
sw.onclick=()=>{
  if(debug){debug=false;saveDebug();return}
  codeBox.style.display='flex';codeIn.value='';codeErr.textContent='';codeIn.focus();
};
function tryCode(){
  if(codeIn.value===CODE){debug=true;saveDebug();codeBox.style.display='none'}
  else codeErr.textContent=t('wrongCode');
}
document.getElementById('codeOk').onclick=tryCode;
codeIn.onkeydown=e=>{if(e.key==='Enter')tryCode()};
const dbgClick=e=>{
  const b=e.target.closest('button');if(!b||state!=='play')return;
  const a=b.dataset.a;
  if(a==='die')return end();
  if(a==='g'||a==='o'||a==='m'||a==='a'||a==='s')give(a);else coinsN+=+a;
};
dbg.addEventListener('click',dbgClick);dbgCoins.addEventListener('click',dbgClick);
// donne un power-up (g = invincibilité, o = turbo), en le stockant si déjà actif
function give(t){
  if(t==='a'){if(mag>0)magQ++;else mag=magDur();return}   // aimant, stockable
  if(t==='s'){slow=5;return}   // malus : ralenti de moitié pendant 5 s
  if(t==='m'){if(mega>0)megaQ++;else mega=MEGA_M}
  else if(t==='o'){const amt=(120+alt*.15)*turboDist();if(boost>0)boostQ.push(amt);else boostMax=boost=amt}
  else if(inv>0||boost>0)invQ++;
  else inv=invDur();
}
function start(){
  state='play';alt=0;bars=[];pw=[];cn=[];coinsN=0;inv=0;invQ=0;boost=0;boostMax=1;boostQ=[];mega=0;megaQ=0;slow=0;mag=0;magQ=0;kmDone=0;spaceShown=false;banT=0;spawnY=0;px=tx=W/2;py=H*0.72;vx=0;
  last.textContent='';menuBtns.style.display='none';stats.style.display='none';openSet.style.display='none';dbg.style.display=debug?'flex':'none';dbgCoins.style.display=debug?'flex':'none';cv.style.display='block';prev=performance.now();
  requestAnimationFrame(loop);
}
function end(){
  state='menu';menuSpace=alt>=SM();try{localStorage.setItem('ballon_menuspace',menuSpace?'1':'0')}catch(e){}menuBtns.style.display='';stats.style.display='';mprev=performance.now();requestAnimationFrame(menuLoop);openSet.style.display='';dbg.style.display='none';dbgCoins.style.display='none';
  if(alt>best){best=alt;try{localStorage.setItem('ballon_best',best)}catch(e){}}
  wallet+=coinsN;saveSkins();
}
addEventListener('pointerdown',e=>{
  if(e.target.closest('button,#settings,#dbg,#dbgCoins,#skinsPanel,#upPanel'))return;
  if(state==='menu')start();
  lastX=e.clientX;
});
addEventListener('pointermove',e=>{
  if(state==='play'&&lastX!==null){tx+=e.clientX-lastX;lastX=e.clientX}
});
addEventListener('pointerup',()=>{lastX=null});
addEventListener('pointercancel',()=>{lastX=null});
addEventListener('keydown',e=>{if(state==='play'){if(e.key==='ArrowLeft')tx-=40;if(e.key==='ArrowRight')tx+=40}});

function spawn(y){
  const r=Math.random(),len=rnd(60,160),dir=Math.random()<.5?-1:1;
  if(extreme){
    // plus de rouges : les bleus bougent comme les violets (zone réduite)
    if(r<.9){
      const amp=rnd(45,90),x0=Math.max(len/2+amp,Math.min(W-len/2-amp,rnd(len/2+amp,W-len/2-amp)));
      bars.push({x:x0,x0,amp,y,len,a:0,w:12,c:r<.45?FIX:PUR,vx:dir*rnd(80,170)});
    }else{const rl=rnd(36,64);bars.push({x:rnd(rl/2,W-rl/2),y,len:rl,a:0,w:12,c:'#fff',vx:0,rb:true})}
    return;
  }
  if(r<.3)bars.push({x:rnd(len/2,W-len/2),y,len,a:0,w:10+((Math.random()*8)|0),c:FIX,vx:0});
  else if(r<.6)bars.push({x:rnd(len/2,W-len/2),y,len,a:0,w:12,c:MOV,vx:dir*rnd(80,170)});
  else if(r<.9){
    const amp=rnd(45,90),x0=Math.max(len/2+amp,Math.min(W-len/2-amp,rnd(len/2+amp,W-len/2-amp)));
    bars.push({x:x0,x0,amp,y,len,a:0,w:12,c:PUR,vx:dir*rnd(80,170)});
  }
  else{const rl=rnd(36,64);bars.push({x:rnd(rl/2,W-rl/2),y,len:rl,a:0,w:12,c:'#fff',vx:0,rb:true})}
}
function rnd(a,b){return a+Math.random()*(b-a)}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}

function loop(now){
  if(state!=='play')return;
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  const speed=mega>0?4000:Math.min(140+alt*.1,650)*(boost>0?turboSpd():1)*(slow>0?.5:1);
  if(slow>0)slow-=dt;
  if(mag>0){mag-=dt;if(mag<=0){mag=0;if(magQ>0){magQ--;mag=magDur()}}}
  const dm=speed*dt/20;alt+=dm;
  while(alt>=(kmDone+1)*1000){kmDone++;coinsN+=100}
  if(!spaceShown&&alt>=SM()){spaceShown=true;banT=2.5}
  if(banT>0)banT-=dt;
  for(const st of STARS){st.y+=st.z*speed*dt*.3/H;if(st.y>1){st.y=0;st.x=Math.random()}}
  if(mega>0){mega-=dm;if(mega<=0){mega=0;if(megaQ>0){megaQ--;mega=MEGA_M}}}
  else if(boost>0){boost-=dm;if(boost<=0){boost=0;if(boostQ.length)boostMax=boost=boostQ.shift()}}
  tx=Math.max(30,Math.min(W-30,tx));
  const old=px;px+=(tx-px)*Math.min(1,dt*9);vx=(px-old)/Math.max(dt,.001);
  spawnY+=speed*dt;
  const gap=Math.min(520,340+alt*.1);
  if(spawnY>=gap){
    spawnY=0;spawn(-20);
    const r=Math.random(),py0=-20-gap/2;
    // power-up placé à mi-chemin entre deux pièges, sans piège double à côté
    const TH=extreme?[.06,.10,.30,.33,.8]:[.15,.23,.30,.38,.85];   // g, o, malus, aimant, pièces
    if(r<TH[0])pw.push({x:rnd(30,W-30),y:py0,s:40,t:'g'});
    else if(r<TH[1])pw.push({x:rnd(30,W-30),y:py0,s:40,t:'o'});
    else if(r<TH[2])pw.push({x:rnd(30,W-30),y:py0,s:40,t:'s'});
    else if(r<TH[3])pw.push({x:rnd(30,W-30),y:py0,s:40,t:'a'});
    else if(r<TH[4]){
      // colonne de pièces entre deux pièges
      const n=3+((Math.random()*3)|0),x0=rnd(50,W-50);
      for(let i=0;i<n;i++)cn.push({x:Math.max(20,Math.min(W-20,x0+Math.sin(i*1.2)*25)),y:py0+(i-(n-1)/2)*30});
    }
    else if(Math.random()<.35)spawn(-20-rnd(60,110));
  }
  if(boost<=0&&mega<=0){
    if(inv>0){inv-=dt;if(inv<0)inv=0}
    if(inv<=0&&invQ>0){invQ--;inv=invDur()}
  }
  const hr=BH*.3,hy=py-BH*.12;
  for(const b of bars){
    b.y+=speed*dt;b.x+=b.vx*dt;
    if(b.amp){if((b.x-b.x0)*b.vx>0&&Math.abs(b.x-b.x0)>b.amp)b.vx*=-1}
    else if((b.x-b.len/2<0&&b.vx<0)||(b.x+b.len/2>W&&b.vx>0))b.vx*=-1;
    const ax=b.x-Math.cos(b.a)*b.len/2,ay=b.y-Math.sin(b.a)*b.len/2,bx=b.x+Math.cos(b.a)*b.len/2,by=b.y+Math.sin(b.a)*b.len/2;
    if((b.rb?(boost<=0&&mega<=0):(inv<=0&&boost<=0&&mega<=0))&&segDist(px,hy,ax,ay,bx,by)<hr+b.w/2){draw();return end()}
  }
  for(const q of pw){
    q.y+=speed*dt;
    if(Math.hypot(px-q.x,hy-q.y)<hr+q.s/2){
      give(q.t);
      q.dead=true;
    }
  }
  for(const c of cn){c.y+=speed*dt;
    if(mag>0){const dx=px-c.x,dy=hy-c.y,d=Math.hypot(dx,dy);if(d<200&&d>1){c.x+=dx/d*520*dt;c.y+=dy/d*520*dt}}
   if(Math.hypot(px-c.x,hy-c.y)<hr+10){c.dead=true;coinsN++}}
  cn=cn.filter(c=>!c.dead&&c.y<H+30);
  pw=pw.filter(q=>!q.dead&&q.y<H+60);
  bars=bars.filter(b=>b.y<H+120);
  draw();requestAnimationFrame(loop);
}
const OFF=document.createElement('canvas'),octx=OFF.getContext('2d');
const RB=['#ff2a2a','#ff9a00','#ffe600','#2fd62f','#00b4ff','#5b4bff','#d233ff'];
// ballon dont l'intérieur blanc passe en arc-en-ciel animé (contour noir conservé)
function rainbow(){
  const w=OFF.width=IMG.width,h=OFF.height=IMG.height,t=(performance.now()/1500)%1;
  octx.drawImage(IMG,0,0);
  octx.globalCompositeOperation='multiply';
  const g=octx.createLinearGradient(0,-h+t*h,0,h+t*h);
  for(let k=0;k<2;k++)RB.forEach((c,i)=>g.addColorStop((k+i/RB.length)/2,c));
  g.addColorStop(1,RB[0]);
  octx.fillStyle=g;octx.fillRect(0,0,w,h);
  octx.globalCompositeOperation='destination-in';octx.drawImage(IMG,0,0);
  octx.globalCompositeOperation='source-over';
  return OFF;
}
const SM=()=>extreme?100000:10000;                       // entrée dans l'espace : 10 km
const STARS=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),z:.3+Math.random()*.7}));
const spaceF=()=>Math.max(0,Math.min(1,(alt-(SM()-1000))/1000)); // fondu ciel -> espace sur le dernier km
function draw(){
  // normal : ciel -> espace à 10 km ; extrême : espace dès le départ, qui rougit à 100 km
  const ex=extreme,f=ex?1:spaceF(),rf=ex?spaceF():0,m=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',');
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgb('+(ex?m([3,3,15],[22,0,2],rf):m([124,196,255],[3,3,15],f))+')');g.addColorStop(1,'rgb('+(ex?m([26,20,80],[130,12,24],rf):m([214,240,255],[26,20,80],f))+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(f>0){ctx.fillStyle='#fff';for(const st of STARS){ctx.globalAlpha=f*st.z;ctx.fillRect(st.x*W,st.y*H,st.z*2.5,st.z*2.5)}ctx.globalAlpha=1}
  ctx.lineCap='round';
  for(const b of bars){
    if(b.rb){
      const gr=ctx.createLinearGradient(b.x-b.len/2,0,b.x+b.len/2,0),sh=Math.floor(performance.now()/120);
      RB.forEach((c,i)=>gr.addColorStop(i/(RB.length-1),RB[(i+sh)%RB.length]));
      ctx.strokeStyle=gr;
    }else ctx.strokeStyle=b.c;
    ctx.lineWidth=b.w;ctx.beginPath();
    ctx.moveTo(b.x-Math.cos(b.a)*b.len/2,b.y-Math.sin(b.a)*b.len/2);
    ctx.lineTo(b.x+Math.cos(b.a)*b.len/2,b.y+Math.sin(b.a)*b.len/2);ctx.stroke();
  }
  for(const c of cn){
    const w=Math.abs(Math.cos(performance.now()/250+c.x*.05))*.7+.3;
    ctx.fillStyle='#ffd23f';ctx.strokeStyle='#b8860b';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(c.x,c.y,10*w,10,0,0,7);ctx.fill();ctx.stroke();
  }
  for(const q of pw){
    const im=q.t==='o'?IMG_BOLT:q.t==='s'?IMG_SLOW:q.t==='a'?IMG_MAG:IMG_SH,k=q.s/Math.max(im.width,im.height);
    if(im.width)ctx.drawImage(im,q.x-im.width*k/2,q.y-im.height*k/2,im.width*k,im.height*k);
  }
  const rb=boost<=0&&mega<=0&&inv>0&&(inv>1||invQ>0||Math.floor(inv*10)%2);
  if(boost>0||mega>0){
    const mg=mega>0;
    ctx.strokeStyle=mg?PINK:ORG;ctx.lineWidth=mg?6:4;ctx.lineCap='round';
    for(let k=-2;k<=2;k++){const y0=py+BH*.45+Math.random()*20;ctx.beginPath();ctx.moveTo(px+k*10,y0);ctx.lineTo(px+k*10,y0+(mg?90:40)+Math.random()*(mg?120:50));ctx.stroke()}
  }
  ctx.save();ctx.translate(px,py);ctx.rotate(Math.max(-.25,Math.min(.25,vx/1800)));
  ctx.drawImage(rb?rainbow():tint(skinColor()),-BW()/2,-BH*.55,BW(),BH);ctx.restore();
  ctx.font='bold 22px "Google Sans",system-ui,sans-serif';ctx.fillStyle=f>.5?'#fff':'#16324f';ctx.textAlign='left';
  ctx.fillText((alt|0)+' m',14,34);
  ctx.textAlign='right';ctx.fillText(coinsN,W-38,34);ctx.textAlign='left';
  ctx.fillStyle='#ffd23f';ctx.strokeStyle='#b8860b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W-24,27,9,0,7);ctx.fill();ctx.stroke();
  let hy2=46;
  const bar=(v,c,a)=>{ctx.globalAlpha=a;ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(14,hy2,90,8);ctx.fillStyle=c;ctx.fillRect(14,hy2,90*v,8);ctx.globalAlpha=1;hy2+=12};
  if(inv>0)bar(inv/invDur(),GREEN,1);
  for(let k=0;k<invQ;k++)bar(1,GREEN,.45);
  if(mega>0)bar(mega/MEGA_M,PINK,1);
  for(let k=0;k<megaQ;k++)bar(1,PINK,.45);
  if(boost>0)bar(boost/boostMax,ORG,1);
  for(const m of boostQ)bar(1,ORG,.45);
  if(slow>0)bar(slow/5,'#1e90ff',1);
  if(mag>0)bar(mag/magDur(),'#c00000',1);
  for(let k=0;k<magQ;k++)bar(1,'#c00000',.45);
  if(banT>0){
    ctx.globalAlpha=Math.min(1,banT);ctx.textAlign='center';ctx.font='bold 40px "Google Sans",system-ui,sans-serif';
    ctx.lineWidth=6;ctx.strokeStyle='#000';ctx.strokeText(t('space'),W/2,H*.3);ctx.fillStyle='#fff';ctx.fillText(t('space'),W/2,H*.3);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
}
</script>
